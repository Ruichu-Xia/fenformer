[project]
name = "fenformer"
version = "0.1.0"
description = "Recognize chess positions (FEN) from photos and renders of 3D boards"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "modal>=1.1,<2",
    "numpy>=2,<3",
    "onnxruntime==1.30.0",
    "pillow>=10,<13",
    "timm==1.0.29",
    "torch>=2.7,<3",
    "wandb>=0.19,<1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fenformer"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
